name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  data:
    name: Dataset (schema + determinism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        # Full history: build_manifest.py derives each dataset's `updated_at`
        # from `git log -1 -- <file>`. A shallow clone makes git report every
        # file as added in HEAD (today), breaking the determinism check.
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.10"
      - name: Install deps
        run: uv sync --dev
      - name: Validate against schema
        run: uv run python source/validate.py
      - name: Stable report identities
        run: uv run python -m unittest discover -s source -p 'test_identities.py'
      - name: Publication request safety
        run: uv run python -m unittest discover -s source -p 'test_publish_data.py'
      - name: OAuth preflight classification
        run: uv run python -m unittest discover -s cloudflare -p 'test_oauth.py'
      - name: Local source history
        run: uv run python -m unittest discover -s source/chinasoft2026 -p 'test_check_updates.py'
      - name: Rebuild dataset and assert it is in sync
        # build_all.py discovers every conference builder (source/<id>/build.py)
        # and rebuilds it, then the manifest. Deliberately NOT a list of
        # per-conference commands: adding a conference must never require an
        # edit here, because a forgotten line would still go green while
        # silently leaving that conference's data unchecked.
        # The builds deterministically write data/ and the lightweight web manifest.
        # If a rerun changes anything, the committed dataset or manifest is
        # stale or was hand-edited — fail before stale data reaches the application.
        run: |
          uv run python source/build_all.py
          if ! git diff --quiet -- data/ web/src/data/manifest.json; then
            echo "::error::Dataset out of sync — rerun the build scripts and commit the result."
            git --no-pager diff -- data/ web/src/data/manifest.json
            exit 1
          fi

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          # package.json lives in web/, not the repo root the action defaults to
          package_json_file: web/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:cloudflare
