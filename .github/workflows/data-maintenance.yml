name: Official source check
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: published-data-maintenance
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.10'
      - run: uv sync --dev
      - name: Check and archive official sources
        env:
          FORA_PUBLISH_TOKEN: ${{ secrets.FORA_PUBLISH_TOKEN }}
        run: uv run python source/check_published.py
      - name: Preserve the report and source differences
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-check
          path: |
            .data-release/check-report.txt
            .data-release/checks/
          retention-days: 30
